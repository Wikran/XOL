<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Declaration File</title>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- DevExtreme CDN -->
  <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.1.3/css/dx.light.css">
  <script src="https://cdn3.devexpress.com/jslib/23.1.3/js/dx.all.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 40px;
    }
    .container {
      max-width: 500px;
      margin: auto;
    }
    .dx-button {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Download Declaration File</h2>

    <div id="filename-input"></div>
    <div id="download-button"></div>
  </div>

  <script>
    const baseUrl = "https://cbsdev2.locktonwattana.com/temp/uploads/";

    // DevExtreme TextBox for filename
    $("#filename-input").dxTextBox({
      placeholder: "Enter filename (e.g., DeclarationTEMP.xlsx)",
      value: "DeclarationTEMP.xlsx",
      width: "100%"
    });

    // DevExtreme Button for download
    $("#download-button").dxButton({
      text: "Download",
      type: "success",
      onClick: function () {
        const filename = $("#filename-input").dxTextBox("instance").option("value").trim();
        if (!filename) {
          DevExpress.ui.notify("Please enter a filename.", "error", 2000);
          return;
        }

        const fileUrl = baseUrl + encodeURIComponent(filename);

        // Create a temporary anchor to trigger download
        const anchor = document.createElement("a");
        anchor.href = fileUrl;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
      }
    });
  </script>
</body>
</html>
