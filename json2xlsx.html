<!DOCTYPE html>
<html>
<head>
	<title>Export to Excel with xlsx CDN</title>
	<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="MasterData.js"></script>
</head>
<body>
	<button onclick="exportToExcel()">Export to Excel</button>
	<script>
		function exportToExcel() {
			const aaJsonArray = aaSubGroup4;

			// Create a new workbook and worksheet
			const wb = XLSX.utils.book_new();
			const ws = XLSX.utils.json_to_sheet(aaJsonArray);

			// Add the worksheet to the workbook
			XLSX.utils.book_append_sheet(wb, ws, "Sheet1");

			// Convert the workbook to an array buffer
			const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });

			// Save the file
			//saveAs(new Blob([buf]), "aaJsonArray.xlsx");
            const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            window.saveAs(blob, "aaJsonArray400.xlsx");

		}
