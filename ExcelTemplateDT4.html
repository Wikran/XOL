<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Excel Report Export — Template + MSTABLE + Date Range</title>

<!-- Use your exact links -->
<link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/24.1.3/css/dx.light.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script type="text/javascript" src="DevExpressDevExtreme/Lib/js/dx.all.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="./fsrc/bundle.min.js"></script>

<style>
  body{font-family:system-ui,Arial;margin:18px;}
  #gridContainer{height:420px;margin-top:10px;}
  button{margin-right:8px;padding:8px 12px;border-radius:6px;}
  #status{margin-top:8px;color:#333;}
  input[type="date"]{padding:5px;margin-right:8px;}
</style>
</head>
<body>

<h2>📊 Report Generator (Department Mapping + Date Range)</h2>
<label>📅 From <input type="date" id="dateFrom"></label>
<label>To <input type="date" id="dateTo"></label>
<br><br>
<button id="loadDbBtn">Load Database Data</button>
<button id="exportBtn">Export to Excel</button>
<div id="status"></div>
<div id="gridContainer"></div>

<script>
  // State
  let gridInstance=null,currentData=[],columnMap=[],placeholderRowIdx=null,directiveRowIdx=null,filterRowIdx=null;
  let templateColFormats={},templateColWidths={},templateColHeaders={},deptMap={},hasMSTable=false;

  // Helpers
  function setStatus(m){ $("#status").text(m); }
  function guessDataType(n){
    if(!n) return "string";
    n=n.toLowerCase();
    if(/(amount|total|score|price|qty|quantity|number|count)/.test(n)) return "number";
    if(/(date|day|time)/.test(n)) return "date";
    return "string";
  }
  function colLetter(n){
    let s="",q=n;
    while(q>0){ const r=(q-1)%26; s=String.fromCharCode(65+r)+s; q=Math.floor((q-1)/26); }
    return s;
  }

  // Parse template
  function parseTemplateWorkbook(wb){
    const ws=wb.getWorksheet("Report");
    if(!ws) throw new Error("Worksheet 'Report' not found");

    deptMap={};
    const ms=wb.getWorksheet("MSTABLE");
    hasMSTable=!!ms;
    if(ms){
      ms.eachRow((r,i)=>{
        if(i===1) return; // header
        const code=r.getCell(1).value, name=r.getCell(2).value;
        if(code!=null && name!=null) deptMap[String(code).trim()]=String(name).trim();
      });
      // Do NOT hide MSTABLE
      ms.state='visible';
    }

    columnMap=[]; templateColFormats={}; templateColWidths={}; templateColHeaders={};
    placeholderRowIdx=null; directiveRowIdx=null; filterRowIdx=null;

    // Find placeholder row with {{...}}
    for(let r=1;r<=500;r++){
      const vals=(ws.getRow(r).values||[]).slice(1);
      if(vals.some(v=>typeof v==="string" && v.includes("{{"))){
        placeholderRowIdx=r; directiveRowIdx=r+1; filterRowIdx=r+2; break;
      }
    }
    if(!placeholderRowIdx) throw new Error("Placeholder row with {{...}} not found in 'Report'");

    const headerArr=(ws.getRow(placeholderRowIdx-1).values||[]).slice(1);
    const phArr=(ws.getRow(placeholderRowIdx).values||[]).slice(1);
    const dirArr=(ws.getRow(directiveRowIdx).values||[]).slice(1);
    const maxCols=Math.max(headerArr.length,phArr.length,dirArr.length);

    for(let c=1;c<=maxCols;c++){
      const phRaw=phArr[c-1], dirRaw=dirArr[c-1];
      let placeholder=null, directive=null;
      if(typeof phRaw==="string"){
        const m=phRaw.match(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/);
        if(m) placeholder=m[1].toLowerCase();
      }
      if(typeof dirRaw==="string"){
        const dm=dirRaw.match(/\{\s*(sum|average|count)\s*\}/i);
        if(dm) directive=dm[1].toLowerCase();
      }
      const col=ws.getColumn(c);
      templateColFormats[c]=col.numFmt||ws.getRow(placeholderRowIdx).getCell(c).numFmt||null;
      templateColWidths[c]=col.width||15;
      templateColHeaders[c]=headerArr[c-1]||placeholder||"";
      columnMap.push({ colIndex:c, placeholder, directive, dataType: placeholder?guessDataType(placeholder):null });
    }
  }

  // Load data
  async function loadDatabaseData(){
    const df=$("#dateFrom").val(), dt=$("#dateTo").val();
    if(!df||!dt){ alert("Please select date range"); return; }

    setStatus("Loading template & data...");
    const tplRes=await fetch("template.xlsx",{cache:"no-store"});
    const buf=await tplRes.arrayBuffer();
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    parseTemplateWorkbook(wb);

    // API params (use isLocalHost from bundle.min.js; do not redefine here)
    const aaTBKey="5ad2685d-4114-4aa5-aa87-67368f4a3559";
    const aaXToX="QTc1RkNDNzUtOEZCNi00NDYwLUIzRjYtNzA3MEI0NDM3OTMw";
    const baseURL=isLocalHost(); // provided by bundle.min.js

    const dateField = columnMap.find(c=>c.dataType==="date" && c.placeholder)?.placeholder || "ReqDate";
    const aqrFull=`ExpGroupCode='700' AND ${dateField} BETWEEN '${df}' AND '${dt}'`;

    const aurl=baseURL+'/DMQ/XOL/'+atob(aaXToX)+'/'+aaTBKey+'/all';
    const aSettings={
      url:aurl, method:"POST", timeout:0,
      headers:{"Content-Type":"application/json"},
      data:JSON.stringify({"@":btoa(aqrFull)})
    };
    const dbRaw=await $.ajax(aSettings);

    // Map API fields to placeholders
    const dataPh=columnMap.filter(c=>c.placeholder && c.placeholder!=="no").map(c=>c.placeholder);
    const sample=dbRaw[0]||{};
    const finalMap={};
    dataPh.forEach(ph=>{
      const f=Object.keys(sample).find(k=>k.toLowerCase()===ph.toLowerCase());
      finalMap[ph]=f||ph;
    });

    // Build data for grid (show department name if available)
    const mapped=dbRaw.map((r,i)=>{
      const o={}; o.no=i+1;
      dataPh.forEach(ph=>{
        let v=r[finalMap[ph]];
        if(ph==="department" && deptMap[v]) v=deptMap[v];
        o[ph]=v;
      });
      return o;
    });

    // Grid columns
    const cols=[];
    for(const cm of columnMap){
      if(!cm.placeholder) continue;
      if(cm.placeholder==="no"){
        cols.push({dataField:"no",caption:"NO",dataType:"number"});
      }else{
        cols.push({
          dataField:cm.placeholder,
          caption:templateColHeaders[cm.colIndex],
          dataType:cm.dataType||guessDataType(cm.placeholder)
        });
      }
    }

    if(!gridInstance){
      gridInstance=$("#gridContainer").dxDataGrid({
        dataSource:mapped, columns:cols,
        showBorders:true, columnAutoWidth:true
      }).dxDataGrid("instance");
    }else{
      gridInstance.option("columns",cols);
      gridInstance.option("dataSource",mapped);
    }

    currentData=mapped;
    setStatus(`Loaded ${mapped.length} rows`);
  }

  // Export
  async function exportReport(data){
    if(!data||!data.length){ alert("No data"); return; }
    setStatus("Exporting...");

    const tplRes=await fetch("template.xlsx",{cache:"no-store"});
    const buf=await tplRes.arrayBuffer();
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    parseTemplateWorkbook(wb);

    const ws=wb.getWorksheet("Report");
    const ms=wb.getWorksheet("MSTABLE"); // visible
    const start=placeholderRowIdx;

    // map placeholder => column index
    const map={}; columnMap.forEach(c=>{ if(c.placeholder) map[c.placeholder]=c.colIndex; });

    // reverse name->code for department
    const nameToCode={};
    Object.keys(deptMap).forEach(cd=>{ nameToCode[deptMap[cd]]=cd; });

    data.forEach((r,i)=>{
      const row=ws.getRow(start+i);

      if(map["no"]){
        row.getCell(map["no"]).value=i+1;
        row.getCell(map["no"]).numFmt="0";
      }

      for(const [ph,val] of Object.entries(r)){
        if(ph==="no") continue;
        const idx=map[ph]; if(!idx) continue;
        const cell=row.getCell(idx);

        if(ph==="department"){
          if(ms){
            // Determine numeric code for XLOOKUP without quotes
            let codeCandidate = null;
            if(nameToCode[val] != null){
              codeCandidate = nameToCode[val]; // val is name
            }else if(deptMap[val] != null){
              codeCandidate = val; // val is code
            }else{
              codeCandidate = val; // unknown; try as-is
            }
            // Coerce to number if numeric; otherwise leave as is (Excel will treat as text and fail gracefully)
            const num = Number(codeCandidate);
            const lookupValue = Number.isNaN(num) ? codeCandidate : num;

            // Build formula WITHOUT quotes and WITHOUT @
            if(typeof lookupValue === "number"){
              cell.value = { formula:`XLOOKUP(${lookupValue},MSTABLE!A:A,MSTABLE!B:B,"")` };
            }else{
              // If not numeric, still avoid quotes per your requirement; write raw value with XLOOKUP (may not match if A:A is numeric)
              cell.value = { formula:`XLOOKUP(${lookupValue},MSTABLE!A:A,MSTABLE!B:B,"")` };
            }
          }else{
            cell.value = val;
          }
        }else{
          const dt = columnMap.find(c=>c.placeholder===ph)?.dataType || guessDataType(ph);
          if(dt==="date" && val){
            const d = val instanceof Date ? val : new Date(val);
            if(!Number.isNaN(d.getTime())){
              cell.value=d;
              cell.numFmt=templateColFormats[idx]||"dd/mm/yyyy";
            }else{
              cell.value=val;
            }
          }else if(dt==="number"){
            const n=Number(val);
            cell.value=Number.isNaN(n)?val:n;
            cell.numFmt=templateColFormats[idx]||"#,##0.00";
          }else{
            cell.value=val;
          }
        }
      }
      row.commit();
    });

    // Totals row
    const end=start+data.length-1;
    const sumRow=ws.getRow(end+1);
    for(const cm of columnMap){
      if(!cm.directive || !cm.placeholder) continue;
      const L=colLetter(cm.colIndex);
      const range=`${L}${start}:${L}${end}`;
      const f = cm.directive==="sum" ? `SUM(${range})`
            : cm.directive==="average" ? `AVERAGE(${range})`
            : `COUNTA(${range})`;
      const c=sumRow.getCell(cm.colIndex);
      c.value={formula:f};
      c.numFmt=templateColFormats[cm.colIndex] || (cm.dataType==="date" ? "dd/mm/yyyy" : cm.directive==="count" ? "0" : "#,##0.00");
    }
    sumRow.commit();

    // Column widths
    for(const [c,w] of Object.entries(templateColWidths)){
      ws.getColumn(Number(c)).width=w||15;
    }

    // Keep MSTABLE visible
    if(ms) ms.state='visible';

    // Hide directive helper row (optional in the Report sheet)
    if(directiveRowIdx) ws.getRow(directiveRowIdx).hidden=true;

    wb.calcProperties.fullCalcOnLoad=true;

    const out=await wb.xlsx.writeBuffer();
    saveAs(new Blob([out]),"Report.xlsx");
    setStatus("Export complete (MSTABLE visible, XLOOKUP without quotes/@)");
  }

  // UI
  $("#loadDbBtn").on("click", loadDatabaseData);
  $("#exportBtn").on("click", ()=>exportReport(currentData));
</script>
</body>
</html>
