<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Fixed Banner with Logo, Toolbar & Sidebar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 1in;
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .top-banner img {
      height: 80%;
      object-fit: contain;
    }

    .toolbar {
      position: fixed;
      top: 1in;
      left: 0;
      width: 100%;
      height: 50px;
      background-color: #000;
      /* Black background */
      color: white;
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 999;
      border-top: 1px solid rgb(144, 143, 143);
      /* White top border line */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }


    .hamburger-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .hamburger-btn.active {
      background-color: #888;
    }

    .hamburger {
      width: 18px;
      height: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hamburger span {
      height: 3px;
      background: white;
      border-radius: 2px;
    }

    .toolbar-title {
      margin-left: 15px;
      font-size: 1rem;
    }

    /* .sidebar {
      position: fixed;
      top: calc(1in + 50px);
      left: -250px;
      width: 250px;
      height: calc(100% - 1in - 50px);
      background-color: #222;
      color: white;
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 998;
    } */
    .sidebar {
      position: fixed;
      top: calc(1in + 50px);
      left: -250px;
      width: 250px;
      height: calc(100% - 1in - 50px);
      background-color: rgba(255, 255, 255, 0.5);
      /* White with 50% transparency */
      color: black;
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 998;
      backdrop-filter: blur(4px);
      /* Optional: adds a frosted glass effect */
    }

    .sidebar.active {
      left: 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      margin-bottom: 10px;
      color: black;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      cursor: pointer;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    .content {
      margin-top: calc(1in + 50px);
      padding: 0;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <!-- Top Banner with Logo -->
  <div class="top-banner">
    <img src="./images/locktonlogo70mmwhite.png?v=1" alt="Logo">
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="hamburger-btn" onclick="toggleSidebar(this)">
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="toolbar-title">First Page</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>Menu</h2>
    <ul>
      <li><a onclick="loadPage('./HTMLedit.html')">Home</a></li>
      <li><a onclick="loadPage('./about.html')">About</a></li>
      <li><a onclick="loadPage('./contact.html')">Contact</a></li>
      <li><a onclick="loadPage('./TESTsendMsMail.html')">Test Email</a></li>
    </ul>
  </div>

  <!-- Main Content with iframe -->
  <div class="content">
    <iframe id="mainFrame" src="" title="Program Frame"></iframe>
  </div>

  <!-- JavaScript -->
  <script>
    let programSource = '';

    function toggleSidebar(btn) {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('active');
      btn.classList.toggle('active');
    }

    function loadPage(path) {
      programSource = path;
      document.getElementById('mainFrame').src = programSource;
    }

    window.onload = () => {
      loadPage('./index000.html');
    };
  </script>

</body>

</html>
