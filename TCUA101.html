            .done(function (e) {
                console.log("set aaTBKey");

                var aaTBKey = aObjMPage[0].TBKey;

                //$(function () { TOP PRG

                    var aMMaMx = localStorage["MMaMx"];
                    var aRRgRs = aMMaMx.split('0');

                    var aRrgSx = aRRgRs[1];

                        aRrgSx = "377B";

                    let nExcelPos = 2;
                    let nPDFPos = 3;
                    let nRPTPos = 4;

                    var arDataU = aRolesAction(aRrgSx, nDataPos, 2);

                    } else {

                        "url": aurl,

                        "timeout": 0,
                        "headers": {
                            "Content-Type": "application/json"
                        },
                        "data": JSON.stringify({
                            "@": aqrFull //" Status!='Resigned' "
                        }),
                    };

                    $("#gridContainer").dxDataGrid({

                        dataSource: new DevExpress.data.CustomStore({
                            key: "ACCCODE",
                            loadMode: "omit",
                            load: function () {
                                return $.post(settings).done(function (response) { console.log(response); });
                            },
                            insert: function (values) {
                                if (aaEnt) {
                                    var ObjKeyData = { EntryBy: aaUsrN, EntryDate: new Date() };
                                    var ObjRowData = JSON.stringify($.extend({}, ObjKeyData, values));
                                }
                                else {
                                    var ObjRowData = JSON.stringify(values);
                                }
                                sendRequestNew("Insert", ObjRowData, aaTBKey, aaPFDMI, atob(aaXToX));
                            },
                            update: function (key, values) {
                                //console.log( aaKeyField );
                                var ObjKeyData = { "ACCCODE": $.trim(key) };   //[aaKeyField] key.trim
                                var ObjRowData = JSON.stringify($.extend({}, ObjKeyData, values));

                                var ObjKeyData = { "ACCCODE": $.trim(key) };   //[aaKeyField] key.trim
                                var ObjRowData = JSON.stringify($.extend({}, ObjKeyData));
                                sendRequestNew("Delete", ObjRowData, aaTBKey, aaPFDMI, atob(aaXToX));

                        allowColumnResizing: true,

                        columnChooser: {
                            enabled: true

                        showBorders: true,
                        sorting: {
                            mode: "multiple"
                        },
                        selection: {

                        },

                        searchPanel: {

                        },
                        paging: {

                        pager: {

                        },
                        showBorders: true,
                        groupPaging: true,
                        showColumnLines: true,
                        showRowLines: true,
                        rowAlternationEnabled: true,

                        export: {
                            enabled: arExcelEx,
                            allowExportSelectedData: true
                        },
                        onExporting: function (e) {
                            const workbook = new ExcelJS.Workbook();
                            const worksheet = workbook.addWorksheet('DATA');
                            DevExpress.excelExporter.exportDataGrid({
                                worksheet: worksheet,
                                component: e.component
                            }).then(function () {
                                workbook.xlsx.writeBuffer().then(function (buffer) {
                                    saveAs(new Blob([buffer], { type: 'application/octet-stream' }), 'ACCOUNTCHART' + '.xlsx');
                                });
                            });
                            e.cancel = true;
                        },
                        onEditorPreparing: function (e) {
                            if (e.parentType === "dataRow" && arDataU === 0) {
                                e.editorOptions.disabled = true;
                            } else {
                                if (e.parentType === "dataRow" && (e.dataField === "EntryBy" || e.dataField === "EntryDate")) {
                                    e.editorOptions.disabled = true;
                                }
                            }
                        },
                        //
                        //
                        // Editing
                        editing: {
                            mode: "popup",
                            useIcons: true,
                            allowUpdating: true,
                            allowDeleting: arDataD,
                            allowAdding: arDataC,
                            form: {
                                labelLocation: 'left',
                                showColonAfterLabel: false,
                                colCount: 2,
                            },
                            popup: {
                                title: "Accounting Chart Info",
                                fullScreen: false,
                                showTitle: true,
                                width: 1000,
                                height: 525,
                                position: {
                                    my: "top",
                                    at: "top",
                                    of: "window"
                                },

                                    e.component.option('toolbarItems[0].options.icon', 'save');
                                    e.component.option('toolbarItems[0].options.type', 'success');
                                    e.component.option('toolbarItems[1].options.text', aCancelText);
                                    e.component.option('toolbarItems[1].options.icon', aCancelicon);
                                    e.component.option('toolbarItems[1].options.type', aCancelType);
                                }
                            }
                        },
                        // column list
                        columns: [
                            {
                                type: "buttons",
                                width: 110,
                                buttons: ["edit", "delete"]
                            },                            
                            {
                                dataField: "ACCCODE",
                                caption: "Accounting Code",
                                sortOrder: "asc",
                                validationRules: [{ type: 'required', message: 'Accounting Code is required' }],
                                width: 100,
                            },
                            {
                                dataField: "TDESC",
                                caption: "Description (THA)",
                                editorType: "dxTextArea",
                                width: 400,
                            },
                            {
                                dataField: "EDESC",
                                caption: "Description (ENG)",
                                editorType: "dxTextArea",
                                width: 400,
                            },
                            {
                                dataField: "ALTERACC",
                                caption: "Alternative Acc. Code",
                                width: 100,
                                visible: false,
                            },
                            {
                                dataField: "MAPPING",
                                caption: "MAPPING",
                                width: 100,
                                visible: false,
                            },

                                caption: "Exp Group",
                                width: 100,
                            },

                                editorType: "dxTextArea",
                                width: 150,
                            },
                            {
                                dataField: "Active",
                                caption: "Used",
                                width: 80,
                            },

                        ],
                        // summary
                        summary: {
                            recalculateWhileEditing: true,
                            skipEmptyValues: false,
                            totalItems: [
                                {
                                    column: "TDESC",
                                    summaryType: "count",
                                    displayFormat: "{0} Items",
                                },
                            ],
                            groupItems: [
                                {
                                    column: "ACCCODE",
                                    summaryType: "count",
                                    displayFormat: "{0} Items",
                                },
                            ],
                        },
                        // Tool Bar
                        onToolbarPreparing: function (e) {
                            var dataGrid = e.component;
                            e.toolbarOptions.items.unshift(
                                {
                                    location: "after",
                                    widget: "dxButton",
                                    type: "success",
                                    options: {
                                        icon: 'collapse',
                                        text: 'Collapse All',
                                        width: 140,
                                        onClick: function (e) {
                                            var expanding = e.component.option("text") === "Expand All";
                                            dataGrid.option("grouping.autoExpandAll", expanding);
                                            e.component.option("text", expanding ? "Collapse All" : "Expand All");
                                            e.component.option("icon", expanding ? "collapse" : "expand");
                                        }
                                    }
                                },
                                {
                                    location: "after",
                                    widget: "dxButton",
                                    visible: arPDFEx,
                                    options: {
                                        icon: "exportpdf",
                                        text: "Export to PDF",

                                            const doc = new jsPDF();
                                            DevExpress.pdfExporter.exportDataGrid({
                                                jsPDFDocument: doc,
                                                component: dataGrid
                                            }).then(function () {
                                                doc.save('ACCOUNTCHART' + '.pdf');
                                            });
                                        }
                                    }
                                },
                                {
                                    location: "after",
                                    widget: "dxButton",
                                    options: {
                                        icon: "refresh",
                                        onClick: function () {
                                            dataGrid.refresh();
                                        }
                                    }
                                }
                            );
