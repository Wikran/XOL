<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Manager</title>
  <style>
    #viewerFrame {
        width: 100%;
        height: 700px;
        border: 1px solid #ccc;
        margin-top: 20px;
        display: none;
    }
</style>
</head>
<body>
    <div class="container" style="max-width: 800px; margin: auto; padding: 20px;">
        <h2>📁 File Center</h2>

        <!-- Upload Button -->
        <div id="showUploadPopupButton" style="margin-bottom: 20px;"></div>

        <!-- Download Section -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <!-- First row -->
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="filename-input" style="flex: 1;"></div>
            </div>

            <!-- Second row -->
            <div style="display: flex; gap: 10px; align-items: center;">
                <div id="browse-button" style="width: 120px;"></div> <!-- list files from server -->
                <div id="download-button" style="width: 140px;"></div>
                <div id="view-button" style="width: 120px;"></div> <!-- view -->
                <!-- <div id="load_transform" style="width: 140px;"></div> -->
                <div style="width: 30px;"></div> <!-- spacer --> <!-- space -->
                <div id="excel_transform" style="width: 180px;"></div>
                <!-- Excel transform {{placehoder}} upload and view -->
                <!-- <div id="view_xlsxmem" style="width: 140px;"></div> -->
            </div>
        </div>


        <!-- Popup for Browse -->
        <div id="file-popup"></div>
        <!-- Buttons -->
        <div id="view-button"></div>
        <!-- <div id="print-button"></div> -->

        <!-- Viewer -->
        <!-- <iframe id="viewerFrame" src="" frameborder="0" scrolling="yes" style="width:100%;height:600px;"></iframe> -->

        <!-- Viewer -->
        <iframe id="viewerFrame" src="" frameborder="0" scrolling="yes"></iframe>
    </div>
    <div id="showUploadPopupButton"></div>
    <div id="uploadPopup"></div>
    <div id="popupUL"></div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
    
        // Helpers
        function addScript(src, checkFn) {
          return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.defer = true;
            s.onload = () => {
              console.log("✅ Script loaded:", src);
              if (checkFn && !checkFn()) {
                console.warn("⚠️ Script loaded but check failed:", src);
              }
              resolve();
            };
            s.onerror = () => {
              console.error("❌ Failed to load script:", src);
              reject();
            };
            document.head.appendChild(s);
          });
        }
    
        function addLink(href, rel = "stylesheet") {
          return new Promise((resolve, reject) => {
            const l = document.createElement("link");
            l.href = href;
            l.rel = rel;
            l.onload = () => {
              console.log("✅ Stylesheet loaded:", href);
              resolve();
            };
            l.onerror = () => {
              console.error("❌ Failed to load stylesheet:", href);
              reject();
            };
            document.head.appendChild(l);
          });
        }
    
        // --- Load resources in order ---
        (async function loadResources() {
          try {
            const origin = window.location.origin;
            const pathname = window.location.pathname;
            const isOutsideXOL = origin.includes("cbsdev2.locktonwattana.com") && pathname.startsWith("/temp/uploads/");
            const basePath = "/XOL"; // always use this for shared resources
    
            // jQuery
            await addScript(`${basePath}/vendor/jquery/3.5.1/jquery.min.js`, () => !!window.jQuery);
    
            // FontAwesome
            await addLink(`${basePath}/fontawesome-free-5.15.1-web/css/fontawesome.css`);
            await addLink(`${basePath}/fontawesome-free-5.15.1-web/css/brands.css`);
            await addLink(`${basePath}/fontawesome-free-5.15.1-web/css/solid.css`);
    
            // DevExtreme Themes
            await addLink(`${basePath}/DevExpressDevExtreme/Lib/css/dx.common.css`);
            const dxTheme = document.createElement("link");
            dxTheme.rel = "stylesheet";
            dxTheme.href = `${basePath}/DevExpressDevExtreme/Lib/css/dx.light.css`;
            dxTheme.setAttribute("dx-theme", "");
            dxTheme.setAttribute("data-theme", "generic.light");
            dxTheme.setAttribute("data-active", "false");
            document.head.appendChild(dxTheme);
    
            // DevExtreme JS
            await addScript(`${basePath}/DevExpressDevExtreme/Lib/js/dx.all.js`, () => !!window.DevExpress);
    
            // Custom
            await addLink(`${basePath}/srp/MHODEE123.css`);
            await addScript(`${basePath}/src/bundle.min.js`);
    
            // Dynamic testFilesMMT.js
            const testSrc = isOutsideXOL
              ? "https://cbsdev2.locktonwattana.com/temp/uploads/testFilesMMT.js"
              : window.location.pathname.replace(/\/[^\/]*$/, "/testFilesMMT.js");
    
            await addScript(testSrc, () => typeof window.testFilesMMT !== "undefined");
    
            // --- Now safe to run DevExtreme widget ---
            if (typeof $.fn.dxTextBox === "function") {
              const filenameInput = $("#filename-input").dxTextBox({
                placeholder: "Enter filename (e.g., DeclarationTEMP.xlsx)",
                value: "",
                width: "100%"
              }).dxTextBox("instance");
    
              console.log("✅ dxTextBox initialized:", filenameInput);
            } else {
              console.error("❌ DevExtreme not registered on jQuery");
            }
    
          } catch (err) {
            console.error("Resource loading failed:", err);
          }
        })();
      });
    </script>
</body>
</html>
