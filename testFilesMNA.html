<body>
    <div class="container" style="max-width: 800px; margin: auto; padding: 20px;">
        <h2>📁 File Center</h2>

        <!-- Upload Button -->
        <div id="showUploadPopupButton" style="margin-bottom: 20px;"></div>

        <!-- Download + View Section -->
        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
            <div id="filename-input" style="flex: 1;"></div>
            <div id="browse-button" style="width: 120px;"></div>
            <div id="download-button" style="width: 140px;"></div>
            <div id="view-button" style="width: 120px;"></div>
        </div>

        <!-- Popup for Browse -->
        <div id="file-popup"></div>

        <!-- Viewer -->
        <iframe id="viewerFrame" src="" frameborder="0" scrolling="yes"></iframe>
    </div>

    <script>
        $(document).ready(function () {
            var aDXTheme = localStorage["aDXTheme"];
            DevExpress.ui.themes.current(aDXTheme);
        });

        const aserverName = isLocalHost();
        const aapilistfile = "list-files.aspx";
        const baseUrl = `${aserverName}/temp/uploads/`;
        const listApi = `${aserverName}/temp/${aapilistfile}`;

        const filenameInput = $("#filename-input").dxTextBox({
            placeholder: "Enter filename (e.g., DeclarationTEMP.xlsx)",
            value: "",
            width: "100%"
        }).dxTextBox("instance");

        // ✅ Download button
        $("#download-button").dxButton({
            text: "Download",
            type: "success",
            icon: "fas fa-download",
            onClick: function () {
                const filename = filenameInput.option("value").trim();
                if (!filename) {
                    DevExpress.ui.notify("Please enter a filename.", "error", 2000);
                    return;
                }
                const fileUrl = baseUrl + encodeURIComponent(filename);
                const anchor = document.createElement("a");
                anchor.href = fileUrl;
                anchor.download = filename;
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
            }
        });

        // ✅ View button
        $("#view-button").dxButton({
            text: "View File",
            type: "default",
            icon: "fas fa-eye",
            onClick: function () {
                const filename = filenameInput.option("value").trim();
                if (!filename) {
                    DevExpress.ui.notify("Please enter a filename.", "error", 2000);
                    return;
                }

                const ext = filename.split('.').pop().toLowerCase();
                const fileUrl = baseUrl + encodeURIComponent(filename);
                let viewerUrl = "";

                if (["xlsx", "xls", "pptx", "ppt", "doc", "docx"].includes(ext)) {
                    viewerUrl = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(fileUrl);
                } else if (ext === "pdf") {
                    viewerUrl = "https://docs.google.com/gview?embedded=true&url=" + encodeURIComponent(fileUrl);
                } else if (["jpg", "jpeg", "png", "gif"].includes(ext)) {
                    viewerUrl = fileUrl;
                } else {
                    viewerUrl = fileUrl;
                }

                $("#viewerFrame").attr("src", viewerUrl).show();
            }
        });

        // ✅ Browse button (already in your code, kept as-is)
        $("#browse-button").dxButton({
            text: "List Files",
            type: "default",
            icon: "fas fa-folder",
            onClick: function () {
                popup.show();
                fetch(listApi, {
                    method: "GET",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    mode: "cors"
                })
                    .then(response => response.json())
                    .then(files => {
                        const fileData = files.map(file => ({
                            filename: file.filename,
                            extension: file.filename.split('.').pop().toLowerCase(),
                            icon: getFileIcon(file.filename),
                            modified: file.modified
                        }));
                        $("#file-grid").dxDataGrid({
                            dataSource: fileData,
                            columns: [
                                { dataField: "filename", caption: "File Name", minWidth: 200 },
                                { dataField: "extension", caption: "Type", width: 80 },
                                { dataField: "modified", caption: "Modified", width: 160 }
                            ],
                            selection: { mode: "single" },
                            onRowClick: function (e) {
                                filenameInput.option("value", e.data.filename);
                                popup.hide();
                            }
                        });
                    });
            }
        });

        // Helper icon function
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch (ext) {
                case "pdf": return "fa-file-pdf";
                case "xlsx":
                case "xls": return "fa-file-excel";
                case "doc":
                case "docx": return "fa-file-word";
                case "ppt":
                case "pptx": return "fa-file-powerpoint";
                default: return "fa-file";
            }
        }

        // ✅ Popup
        const popup = $("#file-popup").dxPopup({
            title: "Select a file",
            visible: false,
            width: 500,
            height: "auto",
            contentTemplate: function (contentElement) {
                $("<div>").attr("id", "file-grid").appendTo(contentElement);
            }
        }).dxPopup("instance");

        // Upload Button
        $("#showUploadPopupButton").dxButton({
            text: "Upload File",
            type: "success",
            icon: "fas fa-file-upload",
            onClick: function () {
                aPopUpUpLoad("X");
            }
        });
    </script>
