        function aRolesDesc(aRoles) {
            /* 1ReadOnly  2CRU 3CRUD  4Disable   5Import   6Export   7Import and Export  8Printable    9Export2PDF    A	Export2Excel    BReport Full Rights */
            let aRolesM = ["00", "ReadOnly", "CRU", "CRUD", "Disable", "Import", "Export", "Import and Export", "Printable", "Export2PDF", "Export2Excel", "Report Full Rights"];
            let aFR = ["Data:", "Excel:", "PDF:", "REPORT:"];
            let aPass = "";
            let aF1 = aRoles.substring(0, 1);
            let i = 0;
            while (i < 4) {
                if (aRoles.substring(i, i + 1) === "A") {
                    aCC = 10;
                } else if (aRoles.substring(i, i + 1) === "B") {
                    aCC = 11;
                } else {
                    aCC = Number(aRoles.substring(i, i + 1));
                }
                aPass = aPass + aFR[i] + " " + aRolesM[aCC] + ",";
                i++;
            }
            return aPass;
        }

        function generateOTP() {
            var digits = '0123456789';
