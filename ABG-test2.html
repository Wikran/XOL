<!DOCTYPE html>
<html>

<head>
    <title>PPM Expenses Reimbursement [Accounting]</title>
    <META HTTP-EQUIV="Pragma" CONTENT="no-cache">
    <META HTTP-EQUIV="Expires" CONTENT="-1">
    <meta http-equiv="Content-Language" content="th">
    <meta http-equiv="content-Type" content="text/html; charset=window-874">
    <meta http-equiv="content-Type" content="text/html; charset=tis-620">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <style>
 .star-animation {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.star {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 1px;
  height: 1px;
  border-radius: 50%;
  background-color: white;
  transform: translate(-50%, -50%);
}

.star:nth-child(1) {
  animation: move-star-1 15s linear infinite;
}

.star:nth-child(2) {
  animation: move-star-2 20s linear infinite;
}

.star:nth-child(3) {
  animation: move-star-3 25s linear infinite;
}

.star:nth-child(4) {
  animation: move-star-4 30s linear infinite;
}

.star:nth-child(5) {
  animation: move-star-5 35s linear infinite;
}

@keyframes move-star-1 {
  from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  to { transform: translate(-50%, -50%) rotate(360deg) scale(1.5); }
}

@keyframes move-star-2 {
  from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  to { transform: translate(-50%, -50%) rotate(360deg) scale(1.5); }
}

@keyframes move-star-3 {
  from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  to { transform: translate(-50%, -50%) rotate(360deg) scale(1.5); }
}

@keyframes move-star-4 {
  from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  to { transform: translate(-50%, -50%) rotate(360deg) scale(1.5); }
}

@keyframes move-star-5 {
  from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  to { transform: translate(-50%, -50%) rotate(360deg) scale(1.5); }
}

    </style>
</head>

<body>
    <div class="star-animation">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
      </div>
      
</body>

</html>
