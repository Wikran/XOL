    <script>
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
        function unloadAllJS() {
            var jsArray = new Array();
            jsArray = document.getElementsByTagName('script');
            for (i = 0; i < jsArray.length; i++) {
                if (jsArray[i].id) {
                    unloadJS(jsArray[i].id)
                } else {
                    jsArray[i].parentNode.removeChild(jsArray[i]);
                }
            }
        }

        $(document).ready(function () {
            localStorage.clear();
            localStorage.clear();
            var aDXTheme = "generic.carmine";
            DevExpress.ui.themes.current(aDXTheme);
            //document.getElementById("aUsrName").innerHTML = "User Name";
        });

        const aGoTo = function (newW) {
            window.location.assign(newW);
        };

        // function disableBack() { window.history.forward(); }
        // setTimeout("disableBack()", 0);
        // window.onunload = function () { null };

        //disableBack();

        var aaPFDMI = isLocalHost();
        var aMainPrj = "main.html"
        $(function () {
            getAzureUN()

            function getAzureUN() {
                var aAzureUN = getCookie("fusrn")
                localStorage.setItem("aaPFDMI", aaPFDMI);
                var aaXTGO = "A75FCC75-8FB6-4460-B3F6-7070B4437930"; //Guest
                var aaTBXX = "A9525EA3-666E-4E93-B37F-3F95F44532E5"; //Table
                var myHeaders = new Headers();
                myHeaders.append("Content-Type", "application/json");
                var raw = JSON.stringify({
                    "@": "email='" + aAzureUN + "'"
                });

                var requestOptions = {
                    method: 'POST',
                    headers: myHeaders,
                    body: raw,
                    redirect: 'follow'
                };

                let aURL = aaPFDMI + "/DMQ/" + acPRJ + "/" + aaXTGO + "/" + aaTBXX + "/all"; // + aUname;

                fetch(aURL, requestOptions)
                    .then(response => response.json())

                    .then(aData => {
                        var aal = btoa(aData[0].Gright); //1
                        var aat = btoa(aData[0].Tkey); //2
                        var apict = aData[0].PictureLoc; //3
                        var aThemeSL = aData[0].Kright;// 4 
                        var aftname = aData[0].Nickname; // 5 THA Name
                        var aLGName = aData[0].LGName; //6 ENG Name
                        var aStaffID = aData[0].Scopebase; // 7
                        var aDeptn = aData[0].Department;// 8
                        var aDivn = aData[0].Division;// 9
                        var aemail = aData[0].email;// 10
                        var aUname = aData[0].IDUsr;// 11 Username
                        var aotpx = aData[0].otp; // no                                  
                        var aAct = aData[0].Active; // no

                        localStorage.setItem("aaXrXg", aal);//1
                        localStorage.setItem("aaXXoX", aat);//2
                        localStorage.setItem("aaXpXt", apict);//3
                        localStorage.setItem("aaDXtm", aThemeSL);//4
                        localStorage.setItem("asFTNAME", aftname);//5 THA Name
                        localStorage.setItem("asFENAME", aLGName);//6 ENG Name
                        localStorage.setItem("asSTFID", aStaffID);//7
                        localStorage.setItem("asDEPT", aDeptn);//8
                        localStorage.setItem("asDIV", aDivn);//9
                        localStorage.setItem("asEMAIL", aemail);//10
                        localStorage.setItem("aaXXuX", aUname);// 11 Username

                        //aGoTo("index04.html");
                        aGoTo(aMainPrj); 
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        location.replace(aaPFDMI+"/XOL/login.html")
                    });
            }
        });
