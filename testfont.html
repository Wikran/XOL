<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Awesome Solid + Brands</title>
  <link href="./fontawesome-free-5.15.1-web/css/fontawesome.css" rel="stylesheet">
  <link href="./fontawesome-free-5.15.1-web/css/solid.css" rel="stylesheet">
  <link href="./fontawesome-free-5.15.1-web/css/brands.css" rel="stylesheet">
  <style>
    body {
      font-family: sans-serif;
      font-size: 18px;
      padding: 2rem;
    }
    i {
      margin-right: 12px;
    }
  </style>
</head>
<body>

  <h2>🔧 Solid Icons (fas)</h2>
  <p><i class="fas fa-user"></i> User</p>
  <p><i class="fas fa-envelope"></i> Email</p>
  <p><i class="fas fa-check-circle"></i> Success</p>

  <h2>🌐 Brand Icons (fab)</h2>
  <p><i class="fab fa-facebook"></i> Facebook</p>
  <p><i class="fab fa-twitter"></i> Twitter</p>
  <p><i class="fab fa-github"></i> GitHub</p>

</body>
</html>
