    <script>
        document.getElementById('upload').addEventListener('change', handleFileSelect, false);

        var ExcelToJSON = function () {

            this.parseExcel = function (file) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    var data = e.target.result;
                    var workbook = XLSX.read(data, {
                        type: 'binary'
                    });
                    workbook.SheetNames.forEach(function (sheetName) {
                        // Here is your object
                        var XL_row_object = XLSX.utils.sheet_to_row_object_array(workbook.Sheets[sheetName]);
                        var json_object = JSON.stringify(XL_row_object);
                        jsonData = JSON.parse(json_object)
                        //console.log(jsonData); //JSON.parse(json_object)
                        jQuery('#xlx_json').val(json_object);
                        console.log("jsonData ", jsonData);
                        console.log("json object ", json_object);
                        aPopUpAddForm(jsonData);

                              }); */
                    })
                };

                reader.onerror = function (ex) {
                    console.log(ex);
                };

                reader.readAsBinaryString(file);

        };

        function handleFileSelect(evt) {

            var files = evt.target.files; // FileList object
            var xl2json = new ExcelToJSON();
            xl2json.parseExcel(files[0]);
        }

        const aPopUpAddForm = (iData) => {
            console.log("iData = ", iData)

            $(() => {
                var aaLastLineNo = 1;
                var gbxRateV = 1;
                const popup = $("#popupContainerAdd").dxPopup({
                    title: "Import Excel" + aaaTitle,
                    width: '1300px',
                    position: { offset: "0 -140" },
                    fullScreen: true,
                    showCloseButton: false,
                    showTitle: true,
                    dragEnabled: true,
                    closeOnOutsideClick: false,
                    resizeEnabled: true,
                    onInitialized: function (e) { e.component.registerKeyHandler("escape", function (arg) { }) }, // ignore when press 'ESC'  

                    contentTemplate: function () {
                        return $("<div />").append(
