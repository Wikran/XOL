<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Email with Microsoft Graph</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
</head>
<body>
    <button id="sendMailButton">Send Mail</button>
    <script>
        const msalConfig = {
            auth: {
                clientId: '6b5abed4-49bf-4578-9e13-efb8c757078a', // Replace with your Client ID find from Azure // d06fb086-2e92-4d48-bd18-9702d0f185b0  //45887e5d-f593-4973-b957-4e80d32875c7
                authority: 'https://login.microsoftonline.com/common', // Use the common endpoint
                redirectUri: 'https://cbsdev2.locktonwattana.com' // Ensure this matches the registered redirect URI //https://cbsdev2.locktonwattana.com  //http://localhost:8089
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        async function getToken() {
            const loginRequest = {
                scopes: ["Mail.Send"]
            };

            try {
                const loginResponse = await msalInstance.loginPopup(loginRequest);
                const tokenRequest = {
                    scopes: ["Mail.Send"],
                    account: loginResponse.account
                };
                const tokenResponse = await msalInstance.acquireTokenSilent(tokenRequest);
                return tokenResponse.accessToken;
            } catch (error) {
                console.error('Error acquiring token:', error);
                if (error instanceof msal.InteractionRequiredAuthError) {
                    try {
                        const tokenResponse = await msalInstance.acquireTokenPopup(tokenRequest);
                        return tokenResponse.accessToken;
                    } catch (popupError) {
                        console.error('Error acquiring token via popup:', popupError);
                    }
                }
                return null;
            }
        }

        async function sendMail() {
            const accessToken = await getToken();
            if (!accessToken) {
                console.error('Failed to acquire access token');
                return;
            }

            const email = {
                message: {
                    subject: "TEST send mail from MS Graph API",
                    body: {
                        contentType: "Text",
                        content: "The new cafeteria is open. ทดสอบภาษาไทยส่งไปที่ Email<br> เพิ่มบรรทัดได้หรือไม่ เพื่อทดสอบการอ่านภาษาไทย<br> Regards,"
                    },
                    toRecipients: [
                        {
                            emailAddress: {
                                address: "wikran@hotmail.com"
                            }
                        }
                    ]
                }
            };

            const response = await fetch('https://graph.microsoft.com/v1.0/me/sendMail', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(email)
            });

            if (response.ok) {
                console.log('Email sent successfully!');
            } else {
                const errorData = await response.json();
                console.error('Error sending email:', errorData);
            }
        }

        document.getElementById('sendMailButton').addEventListener('click', sendMail);
    </script>
</body>
</html>
