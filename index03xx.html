        function aArrayCompare(a, b) {
            let aPass = false;
            $.each(b, function (i, val) {  // each(a,function(i,val)

                let aval2s = aValArr[0];
                if (jQuery.type(aval2s) === "undefined") {
                    aval2s = val;
                }
                var result = $.inArray(aval2s, a); //var result=$.inArray(val,b);

                if (result != -1) {
                    //console.log('Exit');
                    aPass = true;
                    return false;
                } else {
                    aPass = false;
                }
            })
            return aPass;
        };
