<!DOCTYPE html>
<html>

<head>

<body>

    <div id="answer"></div>
    <script>
        const apiKey = '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';

        function getAnswer() {
            const question = document.getElementById("question").value;
            const context = document.getElementById("context").value;
            const data = {
                "model": "text-davinci-edit-001",
