<body>
    <div class="container" style="max-width: 800px; margin: auto; padding: 20px;">
        <h2>📁 File Center</h2>

        <!-- ✅ Base URL Selector -->
        <div style="margin-bottom: 15px;">
            <label style="margin-right:10px;">🌐 Location:</label>
            <div id="baseUrlSelector" style="display:inline-block; width:250px;"></div>
        </div>

        <!-- Upload Button -->
        <div id="showUploadPopupButton" style="margin-bottom: 20px;"></div>

        <!-- Download Section -->
        <div style="display: flex; gap: 10px; align-items: center;">
            <div id="filename-input" style="flex: 1;"></div>
            <div id="browse-button" style="width: 120px;"></div>
            <div id="download-button" style="width: 140px;"></div>
            <div id="view-button" style="width: 120px;"></div>
        </div>

        <!-- Popup for Browse -->
        <div id="file-popup"></div>

        <!-- Viewer -->
        <iframe id="viewerFrame" src="" frameborder="0" scrolling="yes"></iframe>
    </div>
    <div id="showUploadPopupButton"></div>
    <div id="uploadPopup"></div>
    <div id="popupUL"></div>

    <script>
        $(document).ready(function () {
            var aDXTheme = localStorage["aDXTheme"];
            DevExpress.ui.themes.current(aDXTheme);
        });
        const aserverName = isLocalHost();
        const aapilistfile = "list-files.aspx"

        // ✅ Base URL Selector
        let baseUrl = "";
        $("#baseUrlSelector").dxSelectBox({
            items: [
                { name: "Uploads", value: `${aserverName}/temp/uploads/` },
                { name: "Reports", value: `${aserverName}/temp/uploads/reports/` }
            ],
            displayExpr: "name",
            valueExpr: "value",
            value: `${aserverName}/temp/uploads/`, // default
            onValueChanged: function (e) {
                baseUrl = e.value;
                DevExpress.ui.notify("Base URL set to: " + baseUrl, "success", 1500);
            }
        });
        baseUrl = `${aserverName}/temp/uploads/`; // initialize

        const listApi = `${aserverName}/temp/${aapilistfile}`;

        const filenameInput = $("#filename-input").dxTextBox({
            placeholder: "Enter filename (e.g., DeclarationTEMP.xlsx)",
            value: "",
            width: "100%"
        }).dxTextBox("instance");

        $("#download-button").dxButton({
            text: "Download",
            type: "success",
            icon: "fas fa-file-upload",
            onClick: function () {
                const filename = filenameInput.option("value").trim();
                if (!filename) {
                    DevExpress.ui.notify("Please enter a filename.", "error", 2000);
                    return;
                }
                const fileUrl = baseUrl + encodeURIComponent(filename);
                const anchor = document.createElement("a");
                anchor.href = fileUrl;
                anchor.download = filename;
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
            }
        });

        $("#view-button").dxButton({
            text: "View File",
            type: "default",
            icon: "fas fa-eye",
            onClick: function () {
                const filename = filenameInput.option("value").trim();
                if (!filename) {
                    DevExpress.ui.notify("Please enter a filename.", "error", 2000);
                    return;
                }
                const ext = filename.split('.').pop().toLowerCase();
                const fileUrl = baseUrl + encodeURIComponent(filename);
                let viewerUrl = "";

                if (["xlsx", "xls", "pptx", "ppt", "doc", "docx"].includes(ext)) {
                    viewerUrl = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(fileUrl);
                } else if (ext === "pdf") {
                    viewerUrl = "https://docs.google.com/gview?embedded=true&url=" + encodeURIComponent(fileUrl);
                } else if (["jpg", "jpeg", "png", "gif"].includes(ext)) {
                    viewerUrl = fileUrl;
                } else {
                    viewerUrl = fileUrl;
                }
                //alert(viewerUrl)
                $("#viewerFrame").attr("src", viewerUrl).show();
            }
        });

        // ... (rest of your file-grid and popup code remains unchanged) ...
        $("#browse-button").dxButton({
            text: "List Files",
            type: "default",
            icon: "fas fa-folder",
            onClick: function () {
                popup.show();
                fetch(listApi, { //"https://cbsdev2.locktonwattana.com/temp/list-files.aspx"
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include", // ✅ ส่ง cookie และบังคับให้ browser ใส่ Origin
                    mode: "cors" // ✅ ระบุว่าเป็น cross-origin request
                })
                    .then(response => {
                        if (!response.ok) throw new Error("Network response was not ok");
                        return response.json();
                    })
                    .then(files => {
                        if (!Array.isArray(files)) {
                            DevExpress.ui.notify("Invalid file list format", "error", 2000);
                            return;
                        }

                        const fileData = files.map(file => ({
                            filename: file.filename,
                            extension: file.filename.split('.').pop().toLowerCase(),
                            icon: getFileIcon(file.filename),
                            modified: file.modified
                        }));

                        $("#file-grid").dxDataGrid({
                            dataSource: fileData,
                            height: "auto",
                            paging: {
                                enabled: true,
                                pageSize: 50
                            },
                            pager: {
                                showPageSizeSelector: false,
                                showNavigationButtons: true,
                                visible: true
                            },
                            columns: [
                                {
                                    dataField: "icon",
                                    caption: "",
                                    width: 40,
                                    cellTemplate: function (container, options) {
                                        $("<i>")
                                            .addClass("fas")
                                            .addClass(options.value)
                                            .css("font-size", "18px")
                                            .css("color", "#3c3c3c")
                                            .appendTo(container);
                                    }
                                },
                                {
                                    dataField: "filename",
                                    caption: "File Name",
                                    minWidth: 200
                                },
                                {
                                    dataField: "extension",
                                    caption: "Type",
                                    width: 80
                                },
                                {
                                    dataField: "modified",
                                    caption: "Modified",
                                    width: 160
                                }
                            ],
                            rowAlternationEnabled: true,
                            showBorders: true,
                            hoverStateEnabled: true,
                            searchPanel: {
                                visible: true,
                                width: 240,
                                placeholder: "Search files..."
                            },
                            selection: {
                                mode: "single"
                            },
                            onRowClick: function (e) {
                                filenameInput.option("value", e.data.filename);
                                popup.hide();
                            }
                        });
                    })
                    .catch(error => {
                        DevExpress.ui.notify("Failed to load file list", "error", 3000);
                        console.error("Fetch error:", error);
                    });
            }
        });

        // 🔧 Helper function for file icons
        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch (ext) {
                case "pdf": return "fa-file-pdf";
                case "xlsx":
                case "xls": return "fa-file-excel";
                case "doc":
                case "docx": return "fa-file-word";
                case "ppt":
                case "pptx": return "fa-file-powerpoint";
                case "jpg":
                case "jpeg":
                case "png":
                case "gif": return "fa-file-image";
                case "mp4":
                case "mov": return "fa-file-video";
                case "html":
                case "js":
                case "css": return "fa-file-code";
                default: return "fa-file";
            }
        }

        // ✅ Popup ที่ขนาดพอดีกับ grid
        const popup = $("#file-popup").dxPopup({
            title: "Select a file",
            visible: false,
            showTitle: true,
            closeOnOutsideClick: true,
            width: 500,
            height: "auto",
            position: {
                my: "top center",
                at: "top center",
                offset: "0 10" // ✅ ขยับขึ้น 100px
            },
            contentTemplate: function (contentElement) {
                $("<div>")
                    .attr("id", "file-grid")
                    .css({
                        "max-height": "600px",
                        "overflow": "auto"
                    })
                    .appendTo(contentElement);
            }
        }).dxPopup("instance");


        $("#showUploadPopupButton").dxButton({
            text: "Upload File",
            type: "success",
            icon: "fas fa-file-upload",
            onClick: function () {
                aPopUpUpLoad("X");
            }
        });
    </script>
