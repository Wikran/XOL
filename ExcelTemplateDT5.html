<h2>📊 Report Generator — Export What You See (No Excel Formulas)</h2>
<label>📅 From <input type="date" id="dateFrom"></label>
<label>To <input type="date" id="dateTo"></label>
<br><br>
<button id="loadDbBtn">Load Database Data</button>
<button id="exportBtn">Export to Excel</button>
<div id="status"></div>

<script>
  // State
  let gridInstance=null,currentData=[],columnMap=[],placeholderRowIdx=null,directiveRowIdx=null;
  let templateColFormats={},templateColWidths={},templateColHeaders={},deptMap={};

  // Utilities
  function setStatus(m){ $("#status").text(m); }
  function guessDataType(n){
    if(!n) return "string";
    n=n.toLowerCase();
    if(/(amount|total|score|price|qty|quantity|number|count)/.test(n)) return "number";
    if(/(date|day|time)/.test(n)) return "date";
    return "string";
  }
  function colLetter(n){
    let s="",q=n;
    while(q>0){ const r=(q-1)%26; s=String.fromCharCode(65+r)+s; q=Math.floor((q-1)/26); }
    return s;
  }

  // Parse template to get placeholders, directives, widths, formats, MSTABLE mapping
  function parseTemplateWorkbook(wb){
    const ws=wb.getWorksheet("Report");
    if(!ws) throw new Error("Worksheet 'Report' not found in template.xlsx");

    // Build department map from MSTABLE (code -> name). Keep visible.
    deptMap={};
    const ms=wb.getWorksheet("MSTABLE");
    if(ms){
      ms.eachRow((r,i)=>{
        if(i===1) return; // header
        const code=r.getCell(1).value, name=r.getCell(2).value;
        if(code!=null && name!=null){
          deptMap[String(code).trim()] = String(name).trim();
        }
      });
      ms.state='visible';
    }

    // Find placeholder row containing {{...}}
    columnMap=[]; templateColFormats={}; templateColWidths={}; templateColHeaders={};
    placeholderRowIdx=null; directiveRowIdx=null;

    for(let r=1;r<=500;r++){
      const vals=(ws.getRow(r).values||[]).slice(1);
      if(vals.some(v=>typeof v==="string" && v.includes("{{"))){
        placeholderRowIdx=r; directiveRowIdx=r+1; break;
      }
    }
    if(!placeholderRowIdx) throw new Error("Placeholder row with {{...}} not found in 'Report'");

    const headerArr=(ws.getRow(placeholderRowIdx-1).values||[]).slice(1);
    const phArr=(ws.getRow(placeholderRowIdx).values||[]).slice(1);
    const dirArr=(ws.getRow(directiveRowIdx).values||[]).slice(1);
    const maxCols=Math.max(headerArr.length,phArr.length,dirArr.length);

    for(let c=1;c<=maxCols;c++){
      const phRaw=phArr[c-1], dirRaw=dirArr[c-1];
      let placeholder=null, directive=null;
      if(typeof phRaw==="string"){
        const m=phRaw.match(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/);
        if(m) placeholder=m[1].toLowerCase();
      }
      if(typeof dirRaw==="string"){
        const dm=dirRaw.match(/\{\s*(sum|average|count)\s*\}/i);
        if(dm) directive=dm[1].toLowerCase();
      }
      const col=ws.getColumn(c);
      templateColFormats[c]=col.numFmt||ws.getRow(placeholderRowIdx).getCell(c).numFmt||null;
      templateColWidths[c]=col.width||15;
      templateColHeaders[c]=headerArr[c-1]||placeholder||"";
      columnMap.push({ colIndex:c, placeholder, directive, dataType: placeholder?guessDataType(placeholder):null });
    }
  }

  // Load data and show in DataGrid with display values (e.g., department name)
  async function loadDatabaseData(){
    const df=$("#dateFrom").val(), dt=$("#dateTo").val();
    if(!df||!dt){ alert("Please select date range"); return; }

    setStatus("Loading template & data...");
    const tplRes=await fetch("template.xlsx",{cache:"no-store"});
    const buf=await tplRes.arrayBuffer();
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    parseTemplateWorkbook(wb);

    // Use isLocalHost() from bundle.min.js (do not redefine)
    const aaTBKey="5ad2685d-4114-4aa5-aa87-67368f4a3559";
    const aaXToX="QTc1RkNDNzUtOEZCNi00NDYwLUIzRjYtNzA3MEI0NDM3OTMw";
    const baseURL=isLocalHost();

    // Choose a date field from placeholders or fallback
    const dateField = columnMap.find(c=>c.dataType==="date" && c.placeholder)?.placeholder || "ReqDate";
    const aqrFull=`ExpGroupCode='700' AND ${dateField} BETWEEN '${df}' AND '${dt}'`;

    const aurl=baseURL+'/DMQ/XOL/'+atob(aaXToX)+'/'+aaTBKey+'/all';
    const aSettings={
      url:aurl, method:"POST", timeout:0,
      headers:{"Content-Type":"application/json"},
      data:JSON.stringify({"@":btoa(aqrFull)})
    };
    const dbRaw=await $.ajax(aSettings);

    // Build mapping of API fields to template placeholders
    const dataPh=columnMap.filter(c=>c.placeholder && c.placeholder!=="no").map(c=>c.placeholder);
    const sample=dbRaw[0]||{};
    const finalMap={};
    dataPh.forEach(ph=>{
      const f=Object.keys(sample).find(k=>k.toLowerCase()===ph.toLowerCase());
      finalMap[ph]=f||ph;
    });

    // Create data for grid: department shows name (display value)
    const mapped=dbRaw.map((r,i)=>{
      const o={}; o.no=i+1;
      dataPh.forEach(ph=>{
        let v=r[finalMap[ph]];
        if(ph==="department" && deptMap[v]) v=deptMap[v]; // show name
        o[ph]=v;
      });
      return o;
    });

    // DataGrid columns based on the template
    const cols=[];
    for(const cm of columnMap){
      if(!cm.placeholder) continue;
      if(cm.placeholder==="no"){
        cols.push({dataField:"no",caption:"NO",dataType:"number"});
      }else{
        cols.push({
          dataField:cm.placeholder,
          caption:templateColHeaders[cm.colIndex],
          dataType:cm.dataType||guessDataType(cm.placeholder)
        });
      }
    }

    // Render or update grid
    if(!gridInstance){
      gridInstance=$("#gridContainer").dxDataGrid({
        dataSource:mapped, columns:cols,
        showBorders:true, columnAutoWidth:true
      }).dxDataGrid("instance");
    }else{
      gridInstance.option("columns",cols);
      gridInstance.option("dataSource",mapped);
    }

    currentData=mapped;
    setStatus(`Loaded ${mapped.length} rows`);
  }

  // Export exactly what DataGrid displays (no Excel lookup formulas)

 async function exportReport(data){
  if (!data || !data.length) {
    alert("No data to export");
    return;
  }

  setStatus("Exporting...");

  // Load template
  const tplRes = await fetch("template.xlsx", { cache: "no-store" });
  const buf = await tplRes.arrayBuffer();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  parseTemplateWorkbook(wb);

  const ws = wb.getWorksheet("Report");
  const startRow = placeholderRowIdx;
  const headerRow = placeholderRowIdx - 1;
  const periodRow = placeholderRowIdx - 2;

  // 🗓️ Insert "Period DD/MM/YYYY - DD/MM/YYYY" at A[periodRow]
  const df = new Date($("#dateFrom").val());
  const dt = new Date($("#dateTo").val());
  const dfText = df.toLocaleDateString("th-TH", { day: '2-digit', month: '2-digit', year: 'numeric' });
  const dtText = dt.toLocaleDateString("th-TH", { day: '2-digit', month: '2-digit', year: 'numeric' });
  const periodText = `Period ${dfText} - ${dtText}`;
  ws.getRow(periodRow).getCell(1).value = periodText;
  ws.getRow(periodRow).commit();

  // 🔢 Map placeholders to column indexes
  const colMap = {};
  columnMap.forEach(col => {
    if (col.placeholder) colMap[col.placeholder] = col.colIndex;
  });

  // 📝 Write data rows
  data.forEach((rowData, i) => {
    const row = ws.getRow(startRow + i);
    if (colMap["no"]) {
      row.getCell(colMap["no"]).value = i + 1;
      row.getCell(colMap["no"]).numFmt = "0";
    }

    for (const [key, value] of Object.entries(rowData)) {
      if (key === "no") continue;
      const colIdx = colMap[key];
      if (!colIdx) continue;

      const cell = row.getCell(colIdx);
      const dataType = columnMap.find(c => c.placeholder === key)?.dataType || guessDataType(key);

      if (dataType === "date") {
        const dateVal = value instanceof Date ? value : new Date(value);
        if (!Number.isNaN(dateVal.getTime())) {
          cell.value = dateVal;
          cell.numFmt = templateColFormats[colIdx] || "dd/mm/yyyy";
        } else {
          cell.value = value;
        }
      } else if (dataType === "number") {
        const numVal = Number(value);
        cell.value = Number.isNaN(numVal) ? value : numVal;
        cell.numFmt = templateColFormats[colIdx] || "#,##0.00";
      } else {
        cell.value = value;
      }
    }

    row.commit();
  });

  // ➕ Add summary row if directives exist
  const endRow = startRow + data.length - 1;
  const summaryRow = ws.getRow(endRow + 1);

  columnMap.forEach(col => {
    if (!col.directive || !col.placeholder) return;

    const colLetter = String.fromCharCode(64 + col.colIndex);
    const range = `${colLetter}${startRow}:${colLetter}${endRow}`;
    let formula = "";

    if (col.directive === "sum") formula = `SUM(${range})`;
    else if (col.directive === "average") formula = `AVERAGE(${range})`;
    else if (col.directive === "count") formula = `COUNTA(${range})`;

    const cell = summaryRow.getCell(col.colIndex);
    cell.value = { formula };
    cell.numFmt = templateColFormats[col.colIndex] || (col.directive === "count" ? "0" : "#,##0.00");
  });

  summaryRow.commit();

  // 📏 Apply column widths
  Object.entries(templateColWidths).forEach(([colIdx, width]) => {
    ws.getColumn(Number(colIdx)).width = width || 15;
  });

  // 👁️ Keep MSTABLE visible
  const ms = wb.getWorksheet("MSTABLE");
  if (ms) ms.state = "visible";

  // 🧹 Hide directive row (optional)
  if (directiveRowIdx) ws.getRow(directiveRowIdx).hidden = true;

  wb.calcProperties.fullCalcOnLoad = true;

  // 💾 Export file
  const out = await wb.xlsx.writeBuffer();
  saveAs(new Blob([out]), "Report.xlsx");
  setStatus("Export complete");
}

 // UI events
  $("#loadDbBtn").on("click", loadDatabaseData);
  $("#exportBtn").on("click", ()=>exportReport(currentData));
</script>
</body>
