<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with OpenRouter AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 20px;
        }
        .chat-container {
            width: 90%;
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            background: #fff;
            text-align: left;
        }
        .chat-box p {
            padding: 8px;
            border-radius: 5px;
            margin: 5px 0;
        }
        .user-message {
            background: #007bff;
            color: white;
            text-align: right;
        }
        .ai-message {
            background: #ddd;
            color: black;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
        }
        input {
            border: 1px solid #ddd;
        }
        button {
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Chat with AI</h2>
    <div class="chat-box" id="chatBox">
        <p class="ai-message"><strong>AI:</strong> Hello! How can I help you today?</p>
    </div>
    <input type="text" id="userInput" placeholder="Type your message..." autofocus>
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    async function sendMessage() {
        const userInput = document.getElementById("userInput").value;
        if (!userInput.trim()) return;

        // Display user message
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML += `<p class="user-message"><strong>You:</strong> ${userInput}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        // Clear input field
        document.getElementById("userInput").value = "";

        // Call OpenRouter AI API
        const apiUrl = "https://openrouter.ai/api/v1/chat/completions";
        const apiKey = "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"; // Replace with your OpenRouter API key

        const headers = {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
        };

        const body = JSON.stringify({
            model: "openai/gpt-3.5-turbo", // Change to "gpt-4" or "mistral" if needed
            messages: [{ role: "user", content: userInput }],
            max_tokens: 200,
            temperature: 0.7
        });

        try {
            const response = await fetch(apiUrl, {
                method: "POST",
                headers: headers,
                body: body,
            });

            const data = await response.json();
            const aiResponse = data.choices?.[0]?.message?.content || "Sorry, I didn't understand that.";

            // Display AI response
            chatBox.innerHTML += `<p class="ai-message"><strong>AI:</strong> ${aiResponse}</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<p class="ai-message"><strong>AI:</strong> Error: Unable to fetch response.</p>`;
        }
    }
</script>

</body>
</html>
