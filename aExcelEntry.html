<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste Excel Column to Form</title>
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/24.1.5/css/dx.light.css">
</head>
<body>
    <h1>Paste Excel Column into Form</h1>
    <label for="fieldSelect">Select Field:</label>
    <select id="fieldSelect">
        <option value="Description">Description</option>
        <option value="Purpose">Purpose</option>
        <option value="Company">Company</option>
    </select>

    <textarea id="pasteArea" placeholder="Paste Excel column here..." rows="10" style="width: 100%;"></textarea>

    <div id="formContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/24.1.5/js/dx.all.js"></script>
    <script src="aExcelEntry.js"></script>
</body>
</html>
