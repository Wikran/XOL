<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DevExtreme Theme Switcher with Color Groups</title>

  <!-- DevExtreme CSS Themes -->
  <link id="dx-light" rel="stylesheet"
        href="https://cdn3.devexpress.com/jslib/23.2.6/css/dx.material.blue.light.compact.css">
  <link id="dx-dark" rel="stylesheet"
        href="https://cdn3.devexpress.com/jslib/23.2.6/css/dx.material.blue.dark.compact.css" disabled>

  <!-- jQuery must load before DevExtreme -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- DevExtreme JS -->
  <script src="https://cdn3.devexpress.com/jslib/23.2.6/js/dx.all.js"></script>

  <style>
    body {
      margin: 20px;
      font-family: "Segoe UI", sans-serif;
      transition: background-color 0.3s ease;
    }
    #controls {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .theme-icon {
      font-size: 22px;
      transition: opacity 0.3s ease;
    }
    .hidden {
      opacity: 0.2;
    }

    /* === Header background per group and theme === */

    /* Blue group */
    body.color-blue.light-mode .dx-datagrid-headers {
      background-color: #3f51b5; /* Marine Blue */
      color: #fff;
    }
    body.color-blue.dark-mode .dx-datagrid-headers {
      background-color: #0d47a1; /* Dark Blue */
      color: #fff;
    }

    /* Green group */
    body.color-green.light-mode .dx-datagrid-headers {
      background-color: #2e7d32; /* Forest Green */
      color: #fff;
    }
    body.color-green.dark-mode .dx-datagrid-headers {
      background-color: #1b5e20; /* Darker Green */
      color: #fff;
    }

    /* Red group */
    body.color-red.light-mode .dx-datagrid-headers {
      background-color: #c62828; /* Crimson Red */
      color: #fff;
    }
    body.color-red.dark-mode .dx-datagrid-headers {
      background-color: #8e0000; /* Dark Red */
      color: #fff;
    }

    /* Purple group */
    body.color-purple.light-mode .dx-datagrid-headers {
      background-color: #6a1b9a; /* Deep Purple */
      color: #fff;
    }
    body.color-purple.dark-mode .dx-datagrid-headers {
      background-color: #4a148c; /* Dark Purple */
      color: #fff;
    }

    /* Orange group */
    body.color-orange.light-mode .dx-datagrid-headers {
      background-color: #ef6c00; /* Burnt Orange */
      color: #fff;
    }
    body.color-orange.dark-mode .dx-datagrid-headers {
      background-color: #e65100; /* Dark Orange */
      color: #fff;
    }

    /* ✅ New Pink group */
    body.color-pink.light-mode .dx-datagrid-headers {
      background-color: #e91e63; /* Pink 500 */
      color: #fff;
    }
    body.color-pink.dark-mode .dx-datagrid-headers {
      background-color: #880e4f; /* Dark Pink */
      color: #fff;
    }
  </style>
</head>
<body class="dx-theme-background-color dx-theme-text-color light-mode color-blue">
  <!-- Controls: Theme switch + Color group selector -->
  <div id="controls">
    <div id="themeSwitch">
      <span id="sunIcon" class="theme-icon">☀️</span>
      <div id="switchControl"></div>
      <span id="moonIcon" class="theme-icon">🌙</span>
    </div>
    <div id="colorGroup"></div>
  </div>

  <!-- DataGrid container -->
  <div id="gridContainer"></div>

  <script>
    $(function() {
      const users = [
        { ID: 1, Name: "John Smith", Age: 29, Email: "john@example.com" },
        { ID: 2, Name: "Jane Doe", Age: 34, Email: "jane@example.com" },
        { ID: 3, Name: "Michael Johnson", Age: 41, Email: "mike@example.com" }
      ];

      // === Theme switcher logic ===
      function switchTheme(isDark) {
        document.getElementById("dx-light").disabled = isDark;
        document.getElementById("dx-dark").disabled  = !isDark;

        document.body.classList.toggle("dark-mode", isDark);
        document.body.classList.toggle("light-mode", !isDark);

        localStorage.setItem("theme", isDark ? "dark" : "light");

        document.getElementById("sunIcon").classList.toggle("hidden", isDark);
        document.getElementById("moonIcon").classList.toggle("hidden", !isDark);
      }

      let isDark = localStorage.getItem("theme") === "dark";
      switchTheme(isDark);

      $("#switchControl").dxSwitch({
        value: isDark,
        switchedOnText: "",
        switchedOffText: "",
        onValueChanged: function(e) {
          switchTheme(e.value);
        }
      });

      // === Color group selector ===
      const savedGroup = localStorage.getItem("colorGroup") || "blue";
      document.body.classList.add("color-" + savedGroup);

      $("#colorGroup").dxSelectBox({
        items: ["blue", "green", "red", "purple", "orange", "pink"],
        value: savedGroup,
        onValueChanged: function(e) {
          // Remove old color class
          document.body.classList.remove(
            ...Array.from(document.body.classList).filter(c => c.startsWith("color-"))
          );
          // Add new color class
          document.body.classList.add("color-" + e.value);
          localStorage.setItem("colorGroup", e.value);
        }
      });

      // === DataGrid with inline dxForm editing ===
      $("#gridContainer").dxDataGrid({
        dataSource: users,
        keyExpr: "ID",
        showBorders: true,
        editing: {
          mode: "form",
          allowUpdating: true,
          allowAdding: true,
          allowDeleting: true
        },
        columns: [
          { dataField: "Name", validationRules: [{ type: "required" }] },
          { dataField: "Age", dataType: "number", validationRules: [{ type: "range", min: 18, max: 100 }] },
          { dataField: "Email", validationRules: [{ type: "email" }] }
        ]
      });
    });
  </script>
</body>
</html>
