<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DevExtreme + OpenRouter Demo</title>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- DevExtreme -->
  <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.1.3/css/dx.light.css">
  <script src="https://cdn3.devexpress.com/jslib/23.1.3/js/dx.all.js"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    #summaryBox {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      white-space: pre-line;
      background: #f9f9f9;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>📊 ข้อมูลยอดขาย</h2>
  <div id="gridContainer"></div>
  <button id="analyzeBtn">🔎 สรุปข้อมูลด้วย ChatGPT (OpenRouter)</button>
  <div id="summaryBox">ผลลัพธ์จะมาแสดงตรงนี้...</div>

  <script>
    // ✅ Mock data
    const salesData = [
      { id: 1, region: "North", product: "Laptop", sales: 1200 },
      { id: 2, region: "North", product: "Phone", sales: 800 },
      { id: 3, region: "South", product: "Laptop", sales: 600 },
      { id: 4, region: "South", product: "Tablet", sales: 400 },
      { id: 5, region: "East", product: "Laptop", sales: 900 },
      { id: 6, region: "East", product: "Phone", sales: 500 }
    ];

    // ✅ แสดง DataGrid
    $("#gridContainer").dxDataGrid({
      dataSource: salesData,
      keyExpr: "id",
      columns: ["region", "product", "sales"],
      showBorders: true
    });

    // ✅ ปุ่มกดเพื่อส่งข้อมูลไป OpenRouter
    document.getElementById("analyzeBtn").addEventListener("click", async () => {
      const summaryBox = document.getElementById("summaryBox");
      summaryBox.innerText = "⏳ กำลังวิเคราะห์ข้อมูล...";

      const apiUrl = "https://openrouter.ai/api/v1/chat/completions";
      const apiKey = "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" //"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";

      const headers = {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      };

      const input = `ช่วยสรุปข้อมูลยอดขายนี้เป็นภาษาไทย: ${JSON.stringify(salesData)}`;
      //const input = "Hello!!"
      const body = JSON.stringify({
        //model: "mistralai/mistral-7b-instruct:free",
        model: "gpt-4o-mini",
        messages: [{ role: "user", content: input }],
        max_tokens: 1000,
        temperature: 0.7
      });

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: headers,
          body: body
        });

        const result = await response.json();
        console.log("🔍 Raw response:", result);

        const summary = result.choices?.[0]?.message?.content?.trim();

        if (summary) {
          summaryBox.innerText = "📊 สรุปผล:\n" + summary;
        } else {
          summaryBox.innerText = "⚠️ ไม่พบข้อความตอบกลับจากโมเดล";
        }
      } catch (err) {
        summaryBox.innerText = "❌ Error: " + err.message;
      }
    });
  </script>
</body>
</html>
