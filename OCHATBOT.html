<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Chatbot</title>
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/22.1.3/css/dx.light.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/22.1.3/js/dx.all.js"></script>
</head>
<body>
    <script>
$(function() {
    // Sample Q&A JSON data
    const qaData = [
        { question: "What is your name?", answer: "I am your friendly chatbot." },
        { question: "How can I help you?", answer: "You can ask me any question you have." }
    ];

    // Function to find the answer to a question
    function getAnswer(question) {
        // Convert the question to lowercase for case-insensitive matching
        const lowerCaseQuestion = question.toLowerCase();
        
        // Find the best match based on keywords
        const qaPair = qaData.find(qa => lowerCaseQuestion.includes(qa.question.toLowerCase()));
        return qaPair ? qaPair.answer : "Sorry, I don't know the answer to that question.";
    }

    // Define the form structure
    const formItems = [
        {
            dataField: "question",
            label: { text: "Your Question" },
            editorType: "dxTextBox",
            validationRules: [{ type: "required", message: "Question is required" }]
        },
        {
            itemType: "button",
            horizontalAlignment: "right",
            buttonOptions: {
                text: "Submit",
                type: "success",
                onClick: function(e) {
                    const formData = $("#chatbotForm").dxForm("instance").option("formData");
                    const answer = getAnswer(formData.question);
                    alert("Answer: " + answer);
                    $("#chatbotPopup").dxPopup("hide");
                }
            }
        }
    ];

    // Initialize the popup
    $("#chatbotPopup").dxPopup({
        width: 300,
        height: 250,
        contentTemplate: function(contentElement) {
            $("<div>").attr("id", "chatbotForm").appendTo(contentElement);
            $("#chatbotForm").dxForm({
                formData: {},
                items: formItems
            });
        },
        showTitle: true,
        title: "Q&A Chatbot",
        visible: false,
        dragEnabled: true,
        closeOnOutsideClick: true
    });

    // Button to open the popup
    $("#openChatbot").dxButton({
        text: "Open Chatbot",
        onClick: function() {
            $("#chatbotPopup").dxPopup("show");
        }
    });
});
    </script>
    <div id="chatbotPopup"></div>
    <button id="openChatbot">Open Chatbot</button>
    <script src="chatbot.js"></script>
</body>
</html>
