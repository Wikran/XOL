<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Report export — clean nulls, header format on totals, text tokens, Excel→PDF</title>

<!-- UI and grids -->
<link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/24.1.3/css/dx.light.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script type="text/javascript" src="DevExpressDevExtreme/Lib/js/dx.all.js"></script>

<!-- Excel generation & download -->
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<!-- Excel → HTML → PDF (client-side) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Your utility bundle (assumed to provide isLocalHost or other helpers) -->
<script src="./fsrc/bundle.min.js"></script>

<style>
  :root { color-scheme: light; }
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:18px;line-height:1.45}
  h2{margin:0 0 12px}
  #gridContainer{height:420px;margin-top:10px;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:6px}
  .label{font-weight:600}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  button{margin-right:6px;padding:8px 12px;border-radius:6px;border:1px solid #d0d7de;background:#f6f8fa;cursor:pointer}
  button:hover{background:#eef1f4}
  #status{margin-top:8px;color:#444}
  .section{margin-top:22px;padding-top:10px;border-top:1px dashed #ccc}
  #excelPreview{margin-top:12px;overflow:auto;max-height:70vh;border:1px solid #e5e7eb;padding:10px;border-radius:6px;background:#fff}
  #excelPreview table{border-collapse:collapse;width:max-content;min-width:100%}
  #excelPreview td,#excelPreview th{border:1px solid #ddd;padding:4px 6px}
  .muted{color:#666;font-size:12px}
</style>
</head>
<body>

<h2>📊 Report export (Excel) + PDF converter</h2>

<!-- Controls -->
<div class="row">
  <div class="field">
    <span class="label">From</span>
    <div id="dateFrom"></div>
  </div>
  <div class="field">
    <span class="label">To</span>
    <div id="dateTo"></div>
  </div>
</div>

<div class="bar">
  <button id="loadDbBtn">Load data</button>
  <button id="exportBtn">Export to Excel</button>
  <span id="status"></span>
</div>

<div id="gridContainer"></div>

<!-- Excel → PDF module -->
<div class="section">
  <h3>Excel → PDF converter (client-side)</h3>
  <div class="bar">
    <input type="file" id="excelFile" accept=".xls,.xlsx" />
    <button id="btnPreviewExcel">Preview Excel</button>
    <button id="btnDownloadPdf">Download PDF</button>
    <span class="muted">เลือก report.xlsx ที่ได้จากการ export เพื่อนำมาแปลงเป็น PDF</span>
  </div>
  <div id="excelPreview"></div>
</div>

<script>
/* =============================== State & globals =============================== */
let gridInstance=null, currentData=[], columnMap=[], placeholderRowIdx=null, directiveRowIdx=null;
let templateColWidths={}, templateColHeaders={}, deptMap={};

let dxFrom=null, dxTo=null;

/* =============================== Utilities =============================== */
const setStatus = (m)=>$("#status").text(m ?? "");
const guessDataType = (n)=>{
  if(!n) return "string";
  const s=n.toLowerCase();
  if(/(amount|total|sum|price|qty|quantity|number|count)/.test(s)) return "number";
  if(/(date|day|time)/.test(s)) return "date";
  return "string";
};
const colLetter = (n)=>{
  let s="",q=n;
  while(q>0){ const r=(q-1)%26; s=String.fromCharCode(65+r)+s; q=Math.floor((q-1)/26); }
  return s;
};
const toIsoDate = (d)=>{
  const x=new Date(d);
  return Number.isNaN(x.getTime()) ? "" : x.toISOString().slice(0,10);
};
const toEnGbDate = (d)=>{
  const x=new Date(d);
  return Number.isNaN(x.getTime()) ? "" : x.toLocaleDateString("en-GB",{day:'2-digit',month:'2-digit',year:'numeric'});
};

/* =============================== Init date boxes =============================== */
$(function(){
  dxFrom = $("#dateFrom").dxDateBox({
    type:"date", displayFormat:"dd/MM yyyy", useMaskBehavior:true,
    value:new Date(), calendarOptions:{ firstDayOfWeek:1 }
  }).dxDateBox("instance");

  dxTo = $("#dateTo").dxDateBox({
    type:"date", displayFormat:"dd/MM yyyy", useMaskBehavior:true,
    value:new Date(), calendarOptions:{ firstDayOfWeek:1 }
  }).dxDateBox("instance");
});

/* =============================== Template parsing (module) =============================== */
// Build column map, headers, widths; detect placeholder & directive rows; build MSTABLE map
function parseTemplateWorkbook(wb){
  const ws=wb.getWorksheet("Report");
  if(!ws) throw new Error("Worksheet 'Report' not found in template.xlsx");

  // MSTABLE: department code -> name
  deptMap={};
  const ms=wb.getWorksheet("MSTABLE");
  if(ms){
    ms.eachRow((r,i)=>{
      if(i===1) return;
      const code=r.getCell(1).value, name=r.getCell(2).value;
      if(code!=null && name!=null) deptMap[String(code).trim()] = String(name).trim();
    });
  }

  // Detect {{placeholder}} and directive row (next)
  columnMap=[]; templateColWidths={}; templateColHeaders={};
  placeholderRowIdx=null; directiveRowIdx=null;

  for(let r=1;r<=1000;r++){
    const vals=(ws.getRow(r).values||[]).slice(1);
    if(vals.some(v=>typeof v==="string" && /\{\{\s*[^}]+\s*\}\}/.test(v))){
      placeholderRowIdx=r; directiveRowIdx=r+1; break;
    }
  }
  if(!placeholderRowIdx) throw new Error("No {{placeholder}} row found in 'Report'");

  const headerArr=(ws.getRow(placeholderRowIdx-1).values||[]).slice(1);
  const phArr=(ws.getRow(placeholderRowIdx).values||[]).slice(1);
  const dirArr=(ws.getRow(directiveRowIdx).values||[]).slice(1);
  const maxCols=Math.max(headerArr.length, phArr.length, dirArr.length);

  for(let c=1;c<=maxCols;c++){
    const phRaw=phArr[c-1], dirRaw=dirArr[c-1];
    let placeholder=null, directive=null;

    if(typeof phRaw==="string"){
      const m=phRaw.match(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/);
      if(m) placeholder=m[1].trim().toLowerCase();
    }
    if(typeof dirRaw==="string"){
      const dm=dirRaw.match(/\{\s*(sum|average|count)\s*\}/i);
      if(dm) directive=dm[1].toLowerCase();
    }

    const col=ws.getColumn(c);
    templateColWidths[c]=col.width || 15;
    templateColHeaders[c]=headerArr[c-1] || placeholder || "";

    columnMap.push({
      colIndex:c,
      placeholder,
      directive,
      dataType: placeholder?guessDataType(placeholder):null
    });
  }
}

/* =============================== Data loading into grid =============================== */
async function loadDatabaseData(){
  const df=dxFrom.option("value");
  const dt=dxTo.option("value");
  if(!df||!dt){ alert("Please select date range"); return; }

  try{
    setStatus("Loading template & data...");
    const tplRes=await fetch("template.xlsx",{cache:"no-store"});
    const buf=await tplRes.arrayBuffer();
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    parseTemplateWorkbook(wb);

    // API settings (baseURL helper assumed from your bundle)
    const aaTBKey="5ad2685d-4114-4aa5-aa87-67368f4a3559";
    const aaXToX="QTc1RkNDNzUtOEZCNi00NDYwLUIzRjYtNzA3MEI0NDM3OTMw";
    const baseURL = typeof isLocalHost === "function" ? isLocalHost() : "";

    const dateField = columnMap.find(c=>c.dataType==="date" && c.placeholder)?.placeholder || "ReqDate";
    const aqrFull = `ExpGroupCode='700' AND ${dateField} BETWEEN '${toIsoDate(df)}' AND '${toIsoDate(dt)}'`;

    const aurl=`${baseURL}/DMQ/XOL/${atob(aaXToX)}/${aaTBKey}/all`;
    const aSettings={ url:aurl, method:"POST", timeout:0,
      headers:{"Content-Type":"application/json"},
      data:JSON.stringify({"@":btoa(aqrFull)})
    };
    const dbRaw=await $.ajax(aSettings);

    // Map API fields -> placeholders
    const dataPh=columnMap.filter(c=>c.placeholder && c.placeholder!=="no").map(c=>c.placeholder);
    const sample=dbRaw[0]||{};
    const finalMap={};
    dataPh.forEach(ph=>{
      const f=Object.keys(sample).find(k=>k.toLowerCase()===ph.toLowerCase());
      finalMap[ph]=f||ph;
    });

    // Display values only (department code -> name)
    const mapped=dbRaw.map((r,i)=>{
      const o={}; o.no=i+1;
      dataPh.forEach(ph=>{
        let v=r[finalMap[ph]];
        if(ph==="department" && deptMap[v]) v=deptMap[v];
        o[ph]=v;
      });
      return o;
    });

    // Grid columns based on template
    const cols=[];
    for(const cm of columnMap){
      if(!cm.placeholder) continue;
      if(cm.placeholder==="no"){
        cols.push({dataField:"no",caption:"NO",dataType:"number"});
      }else{
        cols.push({
          dataField:cm.placeholder,
          caption:templateColHeaders[cm.colIndex],
          dataType:cm.dataType||guessDataType(cm.placeholder)
        });
      }
    }

    if(!gridInstance){
      gridInstance=$("#gridContainer").dxDataGrid({
        dataSource:mapped, columns:cols,
        showBorders:true, columnAutoWidth:true,
        rowAlternationEnabled:true,
        hoverStateEnabled:true
      }).dxDataGrid("instance");
    }else{
      gridInstance.option("columns",cols);
      gridInstance.option("dataSource",mapped);
    }

    currentData=mapped;
    setStatus(`Loaded ${mapped.length} rows`);
  }catch(err){
    console.error(err);
    setStatus("Load failed");
    alert("Load failed. Check console for details.");
  }
}

/* =============================== Modular writers =============================== */
// Write data rows (values only), clear {{placeholder}} to blank for null/empty
function writeDataRows(ws, data){
  const firstDataRow = placeholderRowIdx;
  const colMap={};
  columnMap.forEach(c=>{ if(c.placeholder) colMap[c.placeholder]=c.colIndex; });

  data.forEach((rowData, i)=>{
    const rNo = firstDataRow + i;
    const row = ws.getRow(rNo);

    // Clear placeholders to blank for all used columns in this row
    columnMap.forEach(cm=>{
      if(cm.placeholder) row.getCell(cm.colIndex).value = "";
    });

    // Write values only
    if(colMap["no"]) row.getCell(colMap["no"]).value = i+1;

    for(const [key,val] of Object.entries(rowData)){
      if(key==="no") continue;
      const colIdx = colMap[key]; if(!colIdx) continue;

      if(val===null || val===undefined || val===""){
        // keep blank (already cleared)
        continue;
      }

      const dtType = columnMap.find(c=>c.placeholder===key)?.dataType || guessDataType(key);
      const cell = row.getCell(colIdx);

      if(dtType==="date"){
        const d = val instanceof Date ? val : new Date(val);
        cell.value = Number.isNaN(d.getTime()) ? "" : d;
      }else if(dtType==="number"){
        const n = Number(val);
        cell.value = Number.isNaN(n) ? "" : n;
      }else{
        cell.value = val;
      }
    }
    row.commit();
  });
}

// Write totals row: replace <text> tokens, then write formulas if cell empty; copy header format to totals
function writeTotalsRow(ws, dataLength){
  const firstDataRow = placeholderRowIdx;
  const lastDataRow = firstDataRow + dataLength - 1;
  const totalsRowIndex = lastDataRow + 1;

  const dirRow = ws.getRow(directiveRowIdx);
  const totalsRow = ws.getRow(totalsRowIndex);
  const headerRow = ws.getRow(placeholderRowIdx - 1);

  columnMap.forEach(cm=>{
    if(!cm.placeholder) return;

    const tCell = totalsRow.getCell(cm.colIndex);
    const rawDir = dirRow.getCell(cm.colIndex).value;

    // Replace <text> token at same address (e.g., <summary> → "summary")
    if(typeof rawDir==="string"){
      const m = rawDir.match(/<\s*([^>]+?)\s*>/);
      if(m) tCell.value = m[1].trim();
    }

    // If directive exists, set formula only if cell still empty
    if(cm.directive){
      const L = colLetter(cm.colIndex);
      const rng = `${L}${firstDataRow}:${L}${lastDataRow}`;
      let formula="";
      if(cm.directive==="sum") formula=`SUM(${rng})`;
      else if(cm.directive==="average") formula=`AVERAGE(${rng})`;
      else if(cm.directive==="count") formula=`COUNTA(${rng})`;

      if(formula && (tCell.value===undefined || tCell.value===null || tCell.value==="")){
        tCell.value = { formula };
      }
    }

    // Copy header format to totals row (font/fill/border/alignment/numFmt)
    const hCell = headerRow.getCell(cm.colIndex);
    if(hCell.font) tCell.font = hCell.font;
    if(hCell.alignment) tCell.alignment = hCell.alignment;
    if(hCell.border) tCell.border = hCell.border;
    if(hCell.fill) tCell.fill = hCell.fill;
    if(hCell.numFmt) tCell.numFmt = hCell.numFmt;
  });

  totalsRow.commit();
}

/* =============================== Export (main orchestrator) =============================== */
async function exportReport(data){
  if(!data || !data.length){ alert("No data to export"); return; }

  try{
    setStatus("Exporting...");
    const tplRes=await fetch("template.xlsx",{cache:"no-store"});
    const buf=await tplRes.arrayBuffer();
    const wb=new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    parseTemplateWorkbook(wb);

    const ws=wb.getWorksheet("Report");

    // Period label above header (value only)
    const headerRowNo = placeholderRowIdx - 1;
    const periodRowNo = headerRowNo - 1;
    const df=dxFrom.option("value"), dt=dxTo.option("value");
    ws.getRow(periodRowNo).getCell(1).value = `For Period ${toEnGbDate(df)} - ${toEnGbDate(dt)}`;
    ws.getRow(periodRowNo).commit();

    // Force header row to plain values (removes any formula)
    const hdrRow = ws.getRow(headerRowNo);
    columnMap.forEach(cm=>{
      if(!cm.placeholder) return;
      const cell = hdrRow.getCell(cm.colIndex);
      const finalText = (cell && typeof cell.text==="string" && cell.text.trim()!=="")
        ? cell.text
        : (templateColHeaders[cm.colIndex] ?? "");
      cell.value = finalText;
    });
    hdrRow.commit();

    // Write data (values only, blanks for nulls)
    writeDataRows(ws, data);

    // Totals row: text tokens + formulas + header format
    writeTotalsRow(ws, data.length);

    // Keep template column widths
    for(const [ci,w] of Object.entries(templateColWidths)){
      ws.getColumn(Number(ci)).width = w || 15;
    }

    // Hide MSTABLE
    const ms = wb.getWorksheet("MSTABLE");
    if(ms) ms.state='hidden';

    wb.calcProperties.fullCalcOnLoad=true;

    const out=await wb.xlsx.writeBuffer();
    saveAs(new Blob([out]),"report.xlsx");
    setStatus("Export complete");
  }catch(err){
    console.error(err);
    setStatus("Export failed");
    alert("Export failed. Check console for details.");
  }
}

/* =============================== Excel → PDF (client-side) =============================== */
// Preview the selected Excel's first worksheet (HTML)
async function previewSelectedExcel(file){
  const arrayBuf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(arrayBuf), { type:"array" });
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  // Generate accessible HTML; you can pass options to customize
  const html = XLSX.utils.sheet_to_html(sheet, { editable:false, header:"", footer:"" });
  // Clean and inject
  const host = document.getElementById("excelPreview");
  host.innerHTML = html;
  // Optional tweak: ensure preview table fills container width
  const tbl = host.querySelector("table");
  if(tbl){ tbl.style.width="100%"; }
}

// Convert the visible preview to PDF using html2canvas + jsPDF
async function downloadPreviewAsPdf(){
  const preview = document.getElementById("excelPreview");
  if(!preview || !preview.firstChild){
    alert("Please preview an Excel file first.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p","pt","a4");

  // Render the preview area into canvas
  const canvas = await html2canvas(preview, { scale:2, backgroundColor:"#ffffff" });
  const imgData = canvas.toDataURL("image/png");
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  const imgWidth = pageWidth;
  const imgHeight = canvas.height * (imgWidth / canvas.width);

  let y = 0;
  // Add multiple pages if needed
  if(imgHeight <= pageHeight){
    doc.addImage(imgData, "PNG", 0, 0, imgWidth, imgHeight);
  }else{
    let remaining = imgHeight;
    let position = 0;
    const pageImgHeight = pageHeight;
    while(remaining > 0){
      doc.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
      remaining -= pageHeight;
      if(remaining > 0){
        doc.addPage();
        position -= pageHeight;
      }
    }
  }
  doc.save("report.pdf");
}

/* =============================== Wire up buttons =============================== */
$("#loadDbBtn").on("click", loadDatabaseData);
$("#exportBtn").on("click", ()=>exportReport(currentData));

let lastSelectedFile = null;
$("#excelFile").on("change", (e)=>{
  lastSelectedFile = e.target.files && e.target.files[0] ? e.target.files[0] : null;
});
$("#btnPreviewExcel").on("click", async ()=>{
  if(!lastSelectedFile){ alert("Please choose an Excel file (report.xlsx)"); return; }
  try{
    setStatus("Rendering preview...");
    await previewSelectedExcel(lastSelectedFile);
    setStatus("Preview ready");
  }catch(err){
    console.error(err); setStatus("Preview failed"); alert("Preview failed. Check console for details.");
  }
});
$("#btnDownloadPdf").on("click", async ()=>{
  try{
    setStatus("Generating PDF...");
    await downloadPreviewAsPdf();
    setStatus("PDF saved");
  }catch(err){
    console.error(err); setStatus("PDF failed"); alert("PDF failed. Check console for details.");
  }
});
</script>
</body>
</html>
