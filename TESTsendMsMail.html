        window.sendEmail = async function (clientId, authority, redirectUri, recipientEmails, subject, bodyContent) {
            const msalConfig = {
                auth: {
                    clientId: clientId,
                    authority: authority,
                    redirectUri: redirectUri
                }
            };

            const msalInstance = new msal.PublicClientApplication(msalConfig);

            const getToken = async () => {
                const loginRequest = {
                    scopes: ["Mail.Send"]
                };

                try {
                    const loginResponse = await msalInstance.loginPopup(loginRequest);
                    const tokenRequest = {
                        scopes: ["Mail.Send"],
                        account: loginResponse.account
                    };

                    const tokenResponse = await msalInstance.acquireTokenSilent(tokenRequest);
                    return tokenResponse.accessToken;
                } catch (error) {
                    console.error('Error acquiring token silently:', error);

                    if (error instanceof msal.InteractionRequiredAuthError) {
                        const tokenResponse = await msalInstance.acquireTokenPopup(tokenRequest);
                        return tokenResponse.accessToken;
                    }

                    throw error;
                }
            };

            try {
                const accessToken = await getToken();

                // Split recipientEmails string into an array and map to required format
                const recipientArray = recipientEmails.split(',').map(email => ({
                    emailAddress: { address: email.trim() }
                }));

                const email = {
                    message: {
                        subject: subject,
                        body: {
                            contentType: "Text",
                            content: bodyContent
                        },
                        toRecipients: recipientArray
                    }
                };

                const response = await fetch('https://graph.microsoft.com/v1.0/me/sendMail', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(email)
                });

                if (response.ok) {
                    console.log('Email sent successfully!');
                } else {
                    const errorData = await response.json();
                    console.error('Error sending email:', errorData);
                }
            } catch (error) {
                console.error('Error in sendEmail function:', error);
            }
        }
